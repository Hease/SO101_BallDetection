[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "soarm-lab"
version = "0.1.0"
description = "SO-ARM101 실습 제공물 — 좌표 → IK → 시뮬/실물 제어"
# sorting/ 이 dataclass 슬롯·PEP604 표기(`X | None`)를 쓰므로 3.10 이상이 필요하다.
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "pyserial>=3.5",
    "mujoco>=3.0",
    "opencv-python>=4.5",
]

# 색 분류 스테이션(sorting/)에만 필요한 것. 기존 실습 코드만 쓸 사람은
# 설치하지 않아도 된다.
[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["soarm_lab", "sorting", "sorting.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 느린 테스트(실제 MuJoCo 물리·Qt 이벤트루프를 기다리는 것)에 slow 를 붙인다.
#   pytest -m "not slow"   → 몇 초. 개발 중에는 이걸 쓴다.
#   pytest                 → 전체 회귀. 커밋 전에 한 번.
# 요구사항이 갑자기 바뀌어 급히 고쳐야 할 때, 5초 피드백과 100초 피드백은
# 완전히 다른 작업이 된다. 그래서 빠른 레인을 따로 둔다.
markers = [
    "slow: 실제 물리·이벤트루프를 기다리는 테스트 (pytest -m 'not slow' 로 제외)",
]
